
version: "3.8"

services:
  web:
    image: ${IMAGE_NAME}
    environment:
      APP_VERSION: ${APP_VERSION}
    ports:
      - target: 5000
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - webnet
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

networks:
  webnet:
    driver: overlay
