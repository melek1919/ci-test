version: '3.8'

services:
  web:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    ports:
      - "80:3000"
    environment:
      - APP_VERSION=${IMAGE_TAG}
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

networks:
  default:
    driver: overlay
