
name: Tests Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Tester Python
        run: python --version

      - name: Executer un test simple
        run: |
          python -c "assert 2 + 2 == 4"
          echo "Test reussi !"
