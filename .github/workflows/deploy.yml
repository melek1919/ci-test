name: Deploy to Swarm

on:
  workflow_dispatch: # Déclenchement uniquement MANUEL via un bouton dans GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Déploiement sur le serveur Swarm via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: github-action-ssh 
          script: |
            echo "${{secrets.SWARM_HOST}}"
            echo "${{secrets.SWARM_USER}}"
            echo "${{secrets.GITHUB_TOKEN}}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_NAME=ghcr.io/${{ github.repository }} IMAGE_TAG=latest docker stack deploy --with-registry-auth --resolve-image=always -c - mystack << 'EOF'
            version: '3.8'
            services:
              web:
                image: ghcr.io/${{ github.repository }}:latest
                ports:
                  - "80:3000"
                deploy:
                  replicas: 3
                  update_config:
                    parallelism: 1
                    delay: 5s
            EOF
